<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>最新情報｜東方英単語録</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body{
      margin:0;
      background:#0b1020;
      color:#fff;
      font-family: system-ui, -apple-system, "Noto Sans JP", sans-serif;
      padding:20px;
    }

    /* ===== グローバルナビ ===== */
    .site-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:16px;
      margin-bottom:24px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .logo{
      width:36px;
      height:36px;
      display:grid;
      place-items:center;
      background:linear-gradient(135deg,#7c5cff,#22d3ee);
      border-radius:10px;
      font-weight:700;
      color:#fff;
      text-decoration:none;
    }

    .site-title{
      font-weight:700;
      letter-spacing:.05em;
    }

    .global-nav{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .global-nav a{
      padding:6px 10px;
      border-radius:10px;
      font-size:14px;
      color:rgba(255,255,255,.7);
      text-decoration:none;
    }

    .global-nav a:hover{
      background:rgba(255,255,255,.08);
      color:#fff;
    }

    .global-nav a.active{
      background:rgba(124,92,255,.25);
      color:#fff;
      border:1px solid rgba(124,92,255,.5);
    }

    h1{
      margin-bottom:20px;
    }

    /* ===== イベントカード ===== */
    .event-list{
      display:flex;
      flex-direction:column;
      gap:24px;
    }

    .event-card{
      max-width:760px;
      margin:auto;
      border:1px solid rgba(255,255,255,.12);
      border-radius:16px;
      overflow:hidden;
      background:rgba(255,255,255,.04);
    }

    .event-banner img{
      width:100%;
      height:auto;
      max-height:320px;
      object-fit:cover;
      display:block;
    }

    .event-body{
      padding:20px;
    }

    .event-title{
      font-size:22px;
      font-weight:700;
      margin-bottom:6px;
    }

    .event-period{
      font-size:14px;
      color:rgba(255,255,255,.7);
      margin-bottom:14px;
    }

    .event-desc{
      line-height:1.8;
      margin-bottom:16px;
      color:rgba(255,255,255,.85);
    }

    .pickup-group{
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    .pickup-block{
      background:rgba(255,255,255,.03);
      border:1px solid rgba(255,255,255,.08);
      border-radius:12px;
      padding:12px;
    }

    .pickup-title{
      font-size:13px;
      color:rgba(255,255,255,.7);
      margin-bottom:8px;
    }

    .pickup{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .pickup img{
      width:64px;
      height:64px;
      object-fit:contain;
      border-radius:10px;
      background:rgba(255,255,255,.08);
      padding:6px;
    }

    .event-char {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      text-decoration: none;
    }

    .event-char-name {
      font-size: 14px;
      color: #fff;
      opacity: 0.85;
    }

  </style>
</head>

<body>

  <!-- グローバルナビ -->
  <header class="site-header">
    <div class="brand">
      <a href="index.html" class="logo">東</a>
      <span class="site-title">東方英単語録</span>
    </div>

    <nav class="global-nav">
      <a href="index.html">概要</a>
      <a href="news.html" class="active">最新情報</a>
      <a href="guide.html">攻略情報</a>
      <a href="characters.html">キャラクター図鑑</a>
    </nav>

  </header>

  <h1>最新情報</h1>

  <div class="event-list" id="event-list"></div>

  <script>
    // news.html のイベント一覧は data/events.json を正本として描画する。
    // 表示順は events.json の配列順をそのまま採用する（自動並び替えはしない）。
    (function () {
      const listEl = document.getElementById("event-list");

      function showMessage(text) {
        listEl.innerHTML = "";
        const p = document.createElement("p");
        p.style.color = "rgba(255,255,255,.7)";
        p.style.textAlign = "center";
        p.textContent = text;
        listEl.appendChild(p);
      }

      function detailLinkLabel(type) {
        return type === "schedule" ? "▶ イベントカレンダーを見る" : "▶ イベント詳細を見る";
      }

      function buildEventCard(ev) {
        const card = document.createElement("div");
        card.className = "event-card";
        if (ev.id) card.setAttribute("data-event-id", ev.id);
        if (ev.type) card.setAttribute("data-type", ev.type);
        if (Array.isArray(ev.tags) && ev.tags.length > 0) {
          card.setAttribute("data-tags", ev.tags.join(","));
        }

        const hasDetail = typeof ev.detailPage === "string" && ev.detailPage.trim() !== "";

        const bannerWrap = document.createElement("div");
        bannerWrap.className = "event-banner";
        const img = document.createElement("img");
        img.src = ev.banner;
        img.alt = ev.title || "";
        if (hasDetail) {
          const bannerLink = document.createElement("a");
          bannerLink.href = ev.detailPage;
          bannerLink.appendChild(img);
          bannerWrap.appendChild(bannerLink);
        } else {
          bannerWrap.appendChild(img);
        }
        card.appendChild(bannerWrap);

        const body = document.createElement("div");
        body.className = "event-body";

        const title = document.createElement("div");
        title.className = "event-title";
        title.textContent = ev.title || "";
        body.appendChild(title);

        const period = document.createElement("div");
        period.className = "event-period";
        period.textContent = ev.periodText || "";
        body.appendChild(period);

        const desc = document.createElement("div");
        desc.className = "event-desc";
        desc.textContent = ev.description || "";
        body.appendChild(desc);

        if (hasDetail) {
          const link = document.createElement("a");
          link.href = ev.detailPage;
          link.textContent = detailLinkLabel(ev.type);
          body.appendChild(link);
        }

        card.appendChild(body);
        return card;
      }

      fetch("data/events.json")
        .then((res) => {
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          return res.json();
        })
        .then((events) => {
          if (!Array.isArray(events) || events.length === 0) {
            showMessage("現在、表示できる最新情報はありません。");
            return;
          }
          listEl.innerHTML = "";
          events.forEach((ev) => listEl.appendChild(buildEventCard(ev)));
        })
        .catch((err) => {
          console.error("イベント情報の読み込みに失敗しました:", err);
          showMessage("最新情報を読み込めませんでした。");
        });
    })();
  </script>

</body>
</html>
